<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>naiops · 区域配置</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172332;font:16px/1.6 system-ui,sans-serif}main{max-width:980px;margin:32px auto;padding:0 20px}header,section{background:white;border:1px solid #dce3eb;border-radius:12px;padding:22px;margin-bottom:18px}h1{margin:0 0 8px;font-size:26px}h2{margin:0 0 12px;font-size:20px}a{color:#175ac6}label{display:block;font-weight:600}input,textarea,select{width:100%;font:inherit;border:1px solid #b5c1ce;border-radius:6px;padding:8px;margin:4px 0 12px}textarea{min-height:100px;resize:vertical}button{font:inherit;border:0;border-radius:6px;padding:9px 15px;background:#175ac6;color:white;cursor:pointer;margin-right:8px}button:disabled{opacity:.5;cursor:wait}.remove{background:#fff1f1;color:#a32222}.row{display:grid;grid-template-columns:140px 1fr;gap:16px}.hint{color:#526172;font-size:14px}#status{white-space:pre-wrap;min-height:26px}.error{color:#a32222}.success{color:#14683b}#links input{font:13px/1.6 monospace}.actions{position:sticky;bottom:0;background:#f4f6fa;padding:12px 0}.region{border-top:1px solid #e5eaf0;padding-top:16px;margin-top:16px}nav{display:flex;gap:20px;margin-top:12px}@media(max-width:600px){.row{grid-template-columns:1fr;gap:0}main{padding:0 12px}}
</style>
<main>
<header><h1>区域配置</h1><p>默认使用美国。添加你已验证的地区出口，客户端只在所选地区内切换；全部失败会断开。</p><nav><a href="/admin/settings">原有设置</a><a href="/logout">退出登录</a></nav></header>
<form id="form"><section><h2>地区与出口</h2><label>默认地区<select id="defaultRegion" required></select></label><div id="regions"></div><button type="button" id="add">添加地区</button><p class="hint">出口按顺序逐行填写 IP:端口，IPv6 使用 [IPv6]:端口。每区最多 8 个，先填主出口，再填备用。保存不验证国家或 ChatGPT 可用性，请先通过实际代理连接检查。</p></section>
<div class="actions"><button id="save" type="submit" disabled>保存配置</button><button id="reload" type="button">重新读取</button><div id="status" role="status" aria-live="polite">正在读取配置…</div></div></form>
<section id="links" hidden><h2>客户端订阅</h2><p class="hint">订阅地址含私密凭据，请勿公开。Mihomo 可在“地区选择”中选择已配置地区；通用客户端按其自身功能选节点。保存后更新客户端订阅。</p><label>订阅范围<select id="scope"><option value="">全部已配置地区</option></select></label><div id="addresses"></div></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let subscriptions={}, loading=false;
function status(message,error=false){$('status').textContent=message;$('status').className=error?'error':'success';}
function regionRows(){return [...document.querySelectorAll('.region')];}
function updateDefaults(selected=$('defaultRegion').value){
 const defaults=$('defaultRegion');defaults.replaceChildren();
 for(const row of regionRows()){const option=document.createElement('option');option.value=row.querySelector('.code').value.toUpperCase().trim();option.textContent=option.value+' · '+row.querySelector('.name').value;defaults.append(option);}
 if([...defaults.options].some(o=>o.value===selected))defaults.value=selected;
}
function addRegion(region={code:'',name:'',exits:[]}){
 const row=document.createElement('div');row.className='region';
 row.innerHTML='<div class="row"><label>地区代码<input class="code" maxlength="2" pattern="[A-Z]{2}" placeholder="US" required></label><label>地区名称<input class="name" maxlength="32" placeholder="美国" required></label></div><label>出口（每行一个，按主备顺序）<textarea class="exits" placeholder="IP:端口" required></textarea></label><button type="button" class="remove">删除地区</button>';
 row.querySelector('.code').value=region.code;row.querySelector('.name').value=region.name;row.querySelector('.exits').value=region.exits.join('\n');
 row.querySelector('.code').addEventListener('input',event=>{event.target.value=event.target.value.toUpperCase();updateDefaults();});
 row.querySelector('.name').addEventListener('input',()=>updateDefaults());
 row.querySelector('.remove').onclick=()=>{if(regionRows().length===1){status('至少保留一个地区。',true);return;}row.remove();updateDefaults();};
 $('regions').append(row);updateDefaults();
}
function showLinks(config){
 const scope=$('scope');const selected=scope.value;scope.replaceChildren(new Option('全部已配置地区',''));
 for(const region of config.regions)scope.append(new Option(region.code+' · '+region.name,region.code));
 if(config.regions.some(r=>r.code===selected))scope.value=selected;
 $('links').hidden=false;renderLinks();
}
function renderLinks(){
 $('addresses').replaceChildren();
 for(const [type,label] of [['clash','Mihomo / Clash Meta'],['vless','VLESS / v2rayA'],['ss','SS（需 v2ray-plugin）']]){
 const address=new URL(subscriptions[type]);if($('scope').value)address.searchParams.set('region',$('scope').value);
 const field=document.createElement('label');field.textContent=label;const input=document.createElement('input');input.readOnly=true;input.value=address.href;input.onclick=()=>input.select();field.append(input);
 const copy=document.createElement('button');copy.type='button';copy.textContent='复制地址';copy.onclick=async()=>{try{await navigator.clipboard.writeText(input.value);status('已复制订阅地址。');}catch{input.select();status('请复制已选中的地址。');}};
 $('addresses').append(field,copy);
 }
}
async function api(options){const response=await fetch('/admin/regions.json',options);if(response.redirected){location.assign('/login');throw new Error('请重新登录。');}const data=await response.json();if(!response.ok)throw new Error(data.error||'请求失败。');return data;}
async function read(){
 if(loading)return;loading=true;$('save').disabled=true;status('正在读取配置…');
 try{const data=await api();subscriptions=data.subscriptions;$('regions').replaceChildren();for(const region of data.config.regions)addRegion(region);updateDefaults(data.config.defaultRegion);showLinks(data.config);status('已读取配置。');}
 catch(error){status(error.message,true);if(!regionRows().length){addRegion({code:'US',name:'美国',exits:['3.132.174.45:443','192.3.208.192:443']});status(error.message+' 可编辑下方配置并保存修复；未保存前不会启用。',true);}}
 finally{loading=false;$('save').disabled=false;}
}
$('form').onsubmit=async event=>{
 event.preventDefault();if(loading)return;loading=true;$('save').disabled=true;
 const config={version:1,defaultRegion:$('defaultRegion').value,regions:regionRows().map(row=>({code:row.querySelector('.code').value.trim(),name:row.querySelector('.name').value.trim(),exits:row.querySelector('.exits').value.split(/\r?\n/).map(line=>line.trim()).filter(Boolean)}))};
 status('正在保存…');try{const saved=await api({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});if(Object.keys(subscriptions).length)showLinks(saved.config);status(saved.message);}catch(error){status(error.message,true);}finally{loading=false;$('save').disabled=false;}
};
$('add').onclick=()=>addRegion();$('reload').onclick=read;$('scope').onchange=renderLinks;read();
</script>
</html>
