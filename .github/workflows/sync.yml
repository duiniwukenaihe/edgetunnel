name: Sync upstream into custom main
on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: naiops-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'duiniwukenaihe/edgetunnel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify current main before updating
        run: bash scripts/verify.sh
      - name: Generate upstream candidate with custom policy
        id: candidate
        run: python3 scripts/sync-upstream.py
      - name: Test candidate before changing main
        if: steps.candidate.outputs.changed == 'true'
        run: bash scripts/verify.sh
      - name: Save candidate patch
        if: always() && steps.candidate.outputs.changed == 'true'
        run: git diff --binary > "$RUNNER_TEMP/upstream-candidate.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.candidate.outputs.changed == 'true'
        with:
          name: upstream-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-candidate.patch
          retention-days: 7
      - name: Atomically advance tested candidate and main
        if: steps.candidate.outputs.changed == 'true' && success()
        env:
          UPSTREAM_SHA: ${{ steps.candidate.outputs.upstream }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js upstream/_worker.js upstream/version.json
          git commit -m "Update tested US policy from upstream $UPSTREAM_SHA"
          REVISION=$(git rev-parse HEAD)
          git push --atomic origin HEAD:refs/heads/upstream-candidate HEAD:refs/heads/main
          echo "Tested main revision: $REVISION" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run deploy.yml --ref main -f revision="$REVISION"
